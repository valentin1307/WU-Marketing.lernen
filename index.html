    const cards=CARDS.filter(c=>c.m===i).length;
    const chs=LEARN[i].chs.length;
    return `<div class="mc b${i}" onclick="nav('mod',${i})">
      <div class="mn c${i}">${m.lbl} — ${m.icon}</div>
      <div class="mt">${m.name}</div>
      <div class="ms">${chs} Kapitel · ${cards} Karten · ${total} Fragen</div>
      <div class="mpb"><div class="mpf f${i}" style="width:${Math.round(Math.random()*30+20)}%"></div></div>
    </div>`}).join('');
  const totalQ=QQ.length,totalC=CARDS.length,totalCh=LEARN.reduce((a,m)=>a+m.chs.length,0);
  setPage('Übersicht','Marketing — WU Wien','',`
    <div class="hero">
      <h2>Marketing Lernapp</h2>
      <p>WU Wien · Mag. Dr. Margit Kastner</p>
      <div class="hstats">
        <div class="hs"><div class="v">${LEARN.length}</div><div class="l">Module</div></div>
        <div class="hs"><div class="v">${totalCh}</div><div class="l">Kapitel</div></div>
        <div class="hs"><div class="v">${totalC}</div><div class="l">Karten</div></div>
        <div class="hs"><div class="v">${totalQ}</div><div class="l">Quiz-Fragen</div></div>
      </div>
    </div>
    ${paid?'':`<div class="al info" style="margin-bottom:14px"><span class="al-ic">🔒</span><div>
      <strong>Vollzugang freischalten</strong> — Jetzt alle Inhalte für die Klausurvorbereitung sichern!
      <br><button class="btn btn-p" style="margin-top:8px" onclick="window.open('${STRIPE_URL}','_blank')">Vollzugang kaufen</button>
    </div></div>`}
    <div class="g4">${mc}</div>`);
}
function rMod(mod){
  if(mod>0&&!paid){showPaywall();return;}
  const m=MODS[mod],lm=LEARN[mod];
  const chs=lm.chs.map((ch,i)=>`
    <div class="ch">
      <div class="ch-h" id="ch-h-${mod}-${i}" onclick="toggleCh(${mod},${i})">
        <span>${ch.t}</span><span class="arr">▾</span>
      </div>
      <div class="ch-b" id="ch-b-${mod}-${i}">
        ${ch.items.map(it=>ri(it)).join('')}
      </div>
    </div>`).join('');
  const qCount=QQ.filter(q=>q.m===mod).length;
  const cCount=CARDS.filter(c=>c.m===mod).length;
  setPage(m.lbl+': '+m.name,m.icon+' Lernmodul',
    `<span class="pil b">${lm.chs.length} Kapitel</span><span class="pil g">${cCount} Karten</span>`,
    `${chs}
    <div class="g2" style="margin-top:16px">
      <div class="card" style="cursor:pointer" onclick="nav('cards')">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">🃏 Karteikarten</div>
        <div style="font-size:11px;color:var(--t2)">${cCount} Karten für dieses Modul</div>
      </div>
      <div class="card" style="cursor:pointer" onclick="startQuizMod(${mod})">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">❓ Quiz starten</div>
        <div style="font-size:11px;color:var(--t2)">${qCount} Fragen für dieses Modul</div>
      </div>
    </div>`);
  const ch0=document.getElementById('ch-h-'+mod+'-0');
  if(ch0)setTimeout(()=>toggleCh(mod,0),50);
}
function toggleCh(mod,i){
  const h=document.getElementById('ch-h-'+mod+'-'+i);
  const b=document.getElementById('ch-b-'+mod+'-'+i);
  if(!h||!b)return;
  const open=b.classList.toggle('op');
  h.classList.toggle('op',open);
}
function showPaywall(){
  setPage('Vollzugang erforderlich','Premium-Inhalt','',`
    <div class="res">
      <div class="res-ring" style="background:#eff4ff;color:var(--blue)">🔒</div>
      <div class="res-g">Inhalte freischalten</div>
      <div class="res-s">Dieses Modul ist Teil des Vollzugangs. Einmaliger Kauf — alle 8 Module, Karteikarten, Quiz und Klausur-Simulation.</div>
      <button class="btn btn-p" onclick="window.open('${STRIPE_URL}','_blank')">Jetzt Vollzugang kaufen</button>
      <p style="font-size:11px;color:var(--t3);margin-top:12px">Nach dem Kauf kurz neu anmelden oder Seite neu laden.</p>
    </div>`);
}
function rCards(){
  if(!paid){showPaywall();return;}
  const tabs=MODS.map((m,i)=>`<button class="mt-tab${fcMod===i?' on':''}" onclick="setFCMod(${i})">${m.lbl}</button>`).join('');
  const mod=fcMod??0;
  const filtered=CARDS.filter(c=>c.m===mod);
  fcMod=mod;fcIdx=Math.min(fcIdx,filtered.length-1);fcFlipped=false;
  const card=filtered[fcIdx];
  setPage('Karteikarten','Alle Module',`<span class="pil b">${filtered.length} Karten</span>`,`
    <div class="mt-row">${tabs}</div>
    <div class="fcnav">
      <button class="fnb" onclick="fcNav(-1)">◀</button>
      <span class="fc-ctr">${fcIdx+1} / ${filtered.length}</span>
      <button class="fnb" onclick="fcNav(1)">▶</button>
    </div>
    <div class="fc-wrap" onclick="flipFC()">
      <div class="fc-in${fcFlipped?' fl':''}" id="fc-in">
        <div class="fc-fr">
          <div class="fc-lbl">${MODS[mod].lbl} · Karte ${fcIdx+1}</div>
          <div class="fc-term">${card.t}</div>
          <div class="fc-hint">Klicken zum Umdrehen</div>
        </div>
        <div class="fc-bk">
          <div class="fc-lbl">Antwort</div>
          <div class="fc-def">${card.d}</div>
        </div>
      </div>
    </div>`);
}
function setFCMod(m){fcMod=m;fcIdx=0;fcFlipped=false;rCards();}
function fcNav(d){
  const filtered=CARDS.filter(c=>c.m===fcMod);
  fcIdx=(fcIdx+d+filtered.length)%filtered.length;
  fcFlipped=false;rCards();
}
function flipFC(){
  fcFlipped=!fcFlipped;
  const el=document.getElementById('fc-in');
  if(el)el.classList.toggle('fl',fcFlipped);
}
function rQuiz(){
  if(!paid){showPaywall();return;}
  quizMod=null;quizFiltered=[];qIdx=0;qAns=null;qScore=0;qWrong=[];
  const tabs=MODS.map((m,i)=>`<button class="mt-tab" onclick="startQuizMod(${i})">${m.lbl}</button>`).join('');
  setPage('Quiz','Wähle ein Modul','',`
    <div class="card">
      <p style="font-size:13px;margin-bottom:14px">Wähle ein Modul oder starte einen Gesamtquiz:</p>
      <div class="mt-row">${tabs}</div>
      <button class="btn btn-p" style="margin-top:12px" onclick="startQuizMod(-1)">Alle Module</button>
    </div>`);
}
function startQuizMod(m){
  quizMod=m;
  quizFiltered=m===-1?[...QQ]:QQ.filter(q=>q.m===m);
  quizFiltered.sort(()=>Math.random()-.5);
  qIdx=0;qAns=null;qScore=0;qWrong=[];
  renderQ();
}
function renderQ(){
  const q=quizFiltered[qIdx];
  const prog=(qIdx/quizFiltered.length)*100;
  const opts=q.o.map((o,i)=>`
    <button class="opt${qAns!==null?(i===q.a?' ok':(i===qAns?' no':'')):''}
    " onclick="answerQ(${i})" ${qAns!==null?'disabled':''}>
      <span class="olet">${String.fromCharCode(65+i)}</span>${o}
    </button>`).join('');
  const exp=qAns!==null?`<div class="qexp">💡 ${q.e}</div>`:'';
  const foot=qAns!==null?`
    <div class="qfoot">
      <span style="font-size:11px;color:var(--t2)">${qIdx+1} / ${quizFiltered.length}</span>
      ${qIdx<quizFiltered.length-1
        ?`<button class="btn btn-p" onclick="nextQ()">Weiter →</button>`
        :`<button class="btn btn-p" onclick="showQResult()">Ergebnis 🎉</button>`}
    </div>`:'';
  const modLabel=quizMod===-1?'Alle Module':MODS[quizMod].lbl;
  setPage('Quiz',modLabel,`<span class="pil b">${qIdx+1}/${quizFiltered.length}</span>`,`
    <div class="qcard">
      <div class="qpb"><div class="qpf" style="width:${prog}%"></div></div>
      <div class="qt">${q.q}</div>
      <div class="opts">${opts}</div>
      ${exp}${foot}
    </div>`);
}
function answerQ(i){
  if(qAns!==null)return;
  qAns=i;
  const q=quizFiltered[qIdx];
  if(i===q.a)qScore++;else qWrong.push({q:q.q,correct:q.o[q.a],chosen:q.o[i]});
  renderQ();
}
function nextQ(){qIdx++;qAns=null;renderQ();}
function showQResult(){
  const pct=Math.round((qScore/quizFiltered.length)*100);
  const grade=pct>=88?'Sehr gut ✨':pct>=75?'Gut 👍':pct>=63?'Befriedigend 📚':pct>=50?'Genügend ⚠️':'Nicht genügend ❌';
  const wrongHtml=qWrong.length?`<div style="margin-top:16px;text-align:left">
    <div class="sect-head">Falsche Antworten</div>
    ${qWrong.map(w=>`<div class="al trap" style="margin-bottom:6px"><span class="al-ic">❌</span>
      <div><strong>${w.q}</strong><br>Deine Antwort: ${w.chosen}<br>Richtig: ${w.correct}</div></div>`).join('')}
  </div>`:'';
  const col=pct>=88?'#ecfdf5':pct>=63?'#eff4ff':'#fef2f2';
  const tc=pct>=88?'#059669':pct>=63?'#2563eb':'#dc2626';
  setPage('Quiz-Ergebnis','','',`
    <div class="res">
      <div class="res-ring" style="background:${col};color:${tc}">${pct}%</div>
      <div class="res-g">${grade}</div>
      <div class="res-s">${qScore} von ${quizFiltered.length} richtig</div>
      <div style="max-width:260px;margin:0 auto">
        <div class="rbar"><span class="rblab">Richtig</span><div class="rbt"><div class="rbf" style="width:${pct}%;background:var(--green)"></div></div><span class="rbp" style="color:var(--green)">${qScore}</span></div>
        <div class="rbar"><span class="rblab">Falsch</span><div class="rbt"><div class="rbf" style="width:${100-pct}%;background:var(--red)"></div></div><span class="rbp" style="color:var(--red)">${quizFiltered.length-qScore}</span></div>
      </div>
      ${wrongHtml}
      <div style="display:flex;gap:8px;justify-content:center;margin-top:20px">
        <button class="btn btn-g" onclick="rQuiz()">Neues Quiz</button>
        <button class="btn btn-p" onclick="startQuizMod(${quizMod})">Wiederholen</button>
      </div>
    </div>`);
}
function rExam(){
  if(!paid){showPaywall();return;}
  examMode=false;
  setPage('Klausur-Simulation','60 Fragen · 60 Minuten','',`
    <div class="card">
      <div class="tg">
        <div class="tc">
          <h3>📋 Aufbau</h3>
          <ul>
            <li>60 Fragen aus allen Modulen</li>
            <li>60 Minuten Bearbeitungszeit</li>
            <li>Multiple-Choice (1 richtige Antwort)</li>
            <li>Keine Pause möglich</li>
          </ul>
        </div>
        <div class="tc">
          <h3>🎯 Bewertung</h3>
          <ul>
            <li><strong>Sehr Gut (1):</strong> ≥ 88%</li>
            <li><strong>Gut (2):</strong> ≥ 75%</li>
            <li><strong>Befriedigend (3):</strong> ≥ 63%</li>
            <li><strong>Genügend (4):</strong> ≥ 50%</li>
            <li><strong>Nicht Genügend (5):</strong> < 50%</li>
          </ul>
        </div>
      </div>
      <button class="btn btn-p" style="margin-top:16px;width:100%" onclick="startExam()">Klausur starten</button>
    </div>`);
}
function startExam(){
  if(!paid){showPaywall();return;}
  examMode=true;
  const shuffled=[...QQ].sort(()=>Math.random()-.5);
  examQs=shuffled.slice(0,60);
  examIdx=0;examScore=0;examWrong=[];examSec=3600;
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    examSec--;
    const t=document.getElementById('exam-timer');
    if(t){const m=Math.floor(examSec/60),s=examSec%60;
      t.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      t.className='timer'+(examSec<600?' d':examSec<1200?' w':'');
    }
    if(examSec<=0){clearInterval(examTimer);finishExam();}
  },1000);
  renderExamQ();
}
function stopExam(){examMode=false;clearInterval(examTimer);}
function renderExamQ(){
  const q=examQs[examIdx];
  const prog=((examIdx)/examQs.length)*100;
  const m=Math.floor(examSec/60),s=examSec%60;
  const timeStr=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  const opts=q.o.map((o,i)=>`
    <button class="opt" onclick="answerExam(${i})">
      <span class="olet">${String.fromCharCode(65+i)}</span>${o}
    </button>`).join('');
  setPage('Klausur-Simulation',`Frage ${examIdx+1} von ${examQs.length}`,
    `<span class="pil b">${examIdx+1}/${examQs.length}</span>`,`
    <div class="exh">
      <div>
        <div style="font-size:10px;color:#4b5a78;margin-bottom:2px">VERBLEIBENDE ZEIT</div>
        <div class="timer${examSec<600?' d':examSec<1200?' w':''}" id="exam-timer">${timeStr}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;color:#4b5a78;margin-bottom:2px">FORTSCHRITT</div>
        <div style="font-size:14px;font-weight:700;color:#fff;font-family:var(--m)">${Math.round(prog)}%</div>
      </div>
    </div>
    <div class="qcard">
      <div class="qpb"><div class="qpf" style="width:${prog}%"></div></div>
      <div class="qt">${q.q}</div>
      <div class="opts">${opts}</div>
    </div>`);
}
function answerExam(i){
  const q=examQs[examIdx];
  if(i===q.a)examScore++;else examWrong.push({q:q.q,mod:MODS[q.m].lbl,correct:q.o[q.a],chosen:q.o[i]});
  examIdx++;
  if(examIdx>=examQs.length){clearInterval(examTimer);finishExam();}
  else renderExamQ();
}
function finishExam(){
  examMode=false;
  const pct=Math.round((examScore/examQs.length)*100);
  const grade=pct>=88?'Sehr gut (1) ✨':pct>=75?'Gut (2) 👍':pct>=63?'Befriedigend (3) 📚':pct>=50?'Genügend (4) ⚠️':'Nicht genügend (5) ❌';
  const col=pct>=88?'#ecfdf5':pct>=63?'#eff4ff':'#fef2f2';
  const tc=pct>=88?'#059669':pct>=63?'#2563eb':'#dc2626';
  const byMod=MODS.map((m,mi)=>{
    const mq=examQs.filter(q=>q.m===mi);
    if(!mq.length)return '';
    const correct=mq.filter(q=>!examWrong.find(w=>w.q===q.q)).length;
    const p=Math.round((correct/mq.length)*100);
    return `<div class="rbar"><span class="rblab" style="width:70px">${m.lbl}</span><div class="rbt"><div class="rbf" style="width:${p}%;background:${p>=63?'var(--green)':'var(--red)'}"></div></div><span class="rbp" style="color:${p>=63?'var(--green)':'var(--red)'}">${p}%</span></div>`;
  }).join('');
  const wrongHtml=examWrong.slice(0,10).map(w=>`
    <div class="al trap" style="margin-bottom:5px"><span class="al-ic">❌</span>
    <div style="font-size:11px"><strong>[${w.mod}] ${w.q}</strong><br>
    Du: ${w.chosen}<br>Richtig: ${w.correct}</div></div>`).join('');
  setPage('Klausur-Ergebnis','','',`
    <div class="res">
      <div class="res-ring" style="background:${col};color:${tc}">${pct}%</div>
      <div class="res-g">${grade}</div>
      <div class="res-s">${examScore} von ${examQs.length} richtig</div>
      <div style="max-width:300px;margin:0 auto 20px">${byMod}</div>
      ${examWrong.length?`<div style="text-align:left;width:100%;max-width:500px">
        <div class="sect-head">Fehler (erste 10)</div>${wrongHtml}
      </div>`:''}
      <div style="display:flex;gap:8px;justify-content:center;margin-top:20px">
        <button class="btn btn-g" onclick="nav('home')">Übersicht</button>
        <button class="btn btn-p" onclick="rExam()">Neue Klausur</button>
      </div>
    </div>`);
}
function rImp(){
  setPage('Impressum','Rechtliche Informationen','',`
    <div class="card">
      <div class="imp-section">
        <h3>Impressum</h3>
        <p>Diese App dient ausschließlich Lernzwecken für Studierenden der WU Wien.</p>
        <p>Inhalte basieren auf den Vorlesungsunterlagen von Mag. Dr. Margit Kastner, Department für Marketing, WU Wien.</p>
        <p>Quelle: Meffert et al. (2024). Marketing. Wiesbaden: Springer Gabler.</p>
      </div>
      <div class="imp-section">
        <h3>Kontakt</h3>
        <p>Bei Fragen oder Problemen: <a href="mailto:tazkdome@gmail.com">tazkdome@gmail.com</a></p>
        <p>Entwickelt von Valentin Bühring-Uhle</p>
      </div>
      <div class="imp-section">
        <h3>Datenschutz</h3>
        <p>Diese App verwendet Supabase für Authentifizierung. Keine Weitergabe persönlicher Daten an Dritte.</p>
      </div>
    </div>`);
}
window.addEventListener('load',async()=>{
  document.getElementById('lo').classList.add('hide');
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user)await initUser(session.user);
  else document.getElementById('ls').classList.remove('hide');
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user&&!user)await initUser(session.user);
    if(event==='SIGNED_OUT'){user=null;paid=false;document.getElementById('app').style.display='none';document.getElementById('ls').classList.remove('hide');}
  });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('ls')&&!document.getElementById('ls').classList.contains('hide'))doLogin();
});
</script>
