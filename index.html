<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Lernapp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7;--sur:#fff;--sb:#0f1623;--sb2:#162035;
  --blue:#2563eb;--blue2:#1d4ed8;--bl:#eff4ff;
  --green:#059669;--gl:#ecfdf5;
  --red:#dc2626;--rl:#fef2f2;
  --amb:#d97706;--al:#fffbeb;
  --pur:#7c3aed;--pl:#f5f3ff;
  --t:#0f1623;--t2:#4b5563;--t3:#9ca3af;
  --bd:#e5e7eb;--r:10px;--r2:7px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --sh2:0 8px 32px rgba(0,0,0,.12);
  --f:'Sora',sans-serif;--m:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--f);font-size:13px;color:var(--t);background:var(--bg)}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:210px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:18px 16px 16px;border-bottom:1px solid #1e2d47}
.sb-logo .wu{font-size:10px;font-weight:700;color:#4d7cff;letter-spacing:2px;text-transform:uppercase}
.sb-logo h1{font-size:14px;font-weight:700;color:#fff;line-height:1.3;margin-top:3px}
.sb-logo p{font-size:11px;color:#4b5a78;margin-top:1px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:9px;font-weight:700;color:#2e4068;letter-spacing:1.5px;text-transform:uppercase;padding:10px 8px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r2);cursor:pointer;color:#7b8db0;font-size:12px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.ni:hover{background:#162035;color:#cbd5e1}
.ni.on{background:var(--blue);color:#fff}
.ni .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.sb-bot{padding:12px 14px;border-top:1px solid #1e2d47}
.exam-btn{width:100%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:var(--r2);padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f)}
.exam-btn:hover{opacity:.88}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--sur);border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-l h2{font-size:15px;font-weight:700}
.top-l p{font-size:11px;color:var(--t2);margin-top:1px}
.pills{display:flex;gap:7px}
.pil{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;font-family:var(--m)}
.pil.b{background:var(--bl);color:var(--blue)}
.pil.g{background:var(--gl);color:var(--green)}
.cnt{flex:1;overflow-y:auto;padding:18px 22px}
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.mc:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc .mn{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.mc .mt{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:8px}
.mc .ms{font-size:10px;color:var(--t3)}
.mpb{height:3px;background:var(--bd);border-radius:2px;margin-top:7px}
.mpf{height:100%;border-radius:2px;transition:width .4s}
.ch{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.ch-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;font-weight:600;font-size:12px;user-select:none;transition:background .15s}
.ch-h:hover{background:#f9fafb}
.ch-b{padding:14px 16px;display:none;border-top:1px solid var(--bd)}
.ch-b.op{display:block}
.arr{font-size:11px;color:var(--t3);transition:transform .2s}
.ch-h.op .arr{transform:rotate(180deg)}
.drow{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.dt{font-weight:600;font-size:11px;min-width:160px;flex-shrink:0;color:var(--t);padding-top:1px}
.dv{font-size:12px;color:var(--t2);flex:1;line-height:1.5}
.al{border-radius:var(--r2);padding:9px 13px;font-size:12px;line-height:1.5;margin:8px 0;display:flex;gap:9px;align-items:flex-start}
.al.trap{background:var(--rl);color:#991b1b;border-left:3px solid var(--red)}
.al.tip{background:var(--gl);color:#065f46;border-left:3px solid var(--green)}
.al.info{background:var(--bl);color:#1e40af;border-left:3px solid var(--blue)}
.al.warn{background:var(--al);color:#92400e;border-left:3px solid var(--amb)}
.al-ic{font-size:13px;flex-shrink:0;margin-top:1px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;margin:7px 0}
.tbl th{background:#f3f4f6;padding:6px 9px;text-align:left;font-weight:600;color:var(--t2);font-size:10px}
.tbl td{padding:6px 9px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.4}
.tbl tr:last-child td{border-bottom:none}
.step-box{background:linear-gradient(135deg,var(--sb),var(--sb2));border-radius:var(--r2);padding:10px 14px;margin:6px 0;color:#fff;font-size:12px}
.step-box .step-num{font-size:10px;font-weight:700;color:#4d7cff;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.step-box .step-q{font-size:11px;color:#9aa3b5;margin-top:3px}
.step-box .step-detail{font-size:11px;color:#cbd5e1;margin-top:4px;padding-top:4px;border-top:1px solid #1e2d47}
.formula-box{background:#0f1623;border-radius:var(--r2);padding:10px 14px;margin:6px 0;font-family:var(--m);font-size:12px;color:#5b8cff;border-left:3px solid #2563eb}
.formula-box .formula-lbl{font-size:10px;color:#4b5a78;margin-bottom:4px;font-family:var(--f);font-style:normal}
.formula-box small{color:#9aa3b5;font-size:10px;font-family:var(--f)}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kv-item{background:var(--bl);border-radius:var(--r2);padding:8px 11px}
.kv-item .kv-t{font-size:10px;font-weight:700;color:var(--blue);margin-bottom:2px}
.kv-item .kv-v{font-size:11px;color:var(--t2);line-height:1.4}
.kv-item.green{background:var(--gl)}.kv-item.green .kv-t{color:var(--green)}
.kv-item.red{background:var(--rl)}.kv-item.red .kv-t{color:var(--red)}
.kv-item.amber{background:var(--al)}.kv-item.amber .kv-t{color:var(--amb)}
.kv-item.pur{background:var(--pl)}.kv-item.pur .kv-t{color:var(--pur)}
.badge-row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:600}
.badge.b{background:var(--bl);color:var(--blue)}
.badge.g{background:var(--gl);color:var(--green)}
.badge.r{background:var(--rl);color:var(--red)}
.badge.a{background:var(--al);color:var(--amb)}
.badge.p{background:var(--pl);color:var(--pur)}
.sect-head{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.fc-wrap{perspective:1200px;width:100%;max-width:500px;margin:0 auto 20px;height:250px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc-in.fl{transform:rotateY(180deg)}
.fc-fr,.fc-bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc-fr{background:var(--sb);color:#fff}
.fc-bk{background:var(--sur);color:var(--t);transform:rotateY(180deg);border:1px solid var(--bd);box-shadow:var(--sh2)}
.fc-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.45;margin-bottom:10px}
.fc-term{font-size:16px;font-weight:700;line-height:1.3}
.fc-def{font-size:12px;color:var(--t2);line-height:1.5}
.fc-hint{font-size:10px;opacity:.35;margin-top:10px}
.qcard{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:20px;box-shadow:var(--sh)}
.qpb{height:4px;background:var(--bd);border-radius:2px;margin-bottom:18px}
.qpf{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.qt{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:11px 14px;border:1.5px solid var(--bd);border-radius:var(--r2);font-size:12px;cursor:pointer;text-align:left;background:var(--sur);color:var(--t);line-height:1.4;transition:all .15s;display:flex;gap:10px;align-items:flex-start;font-family:var(--f)}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--bl)}
.opt.ok{border-color:var(--green);background:var(--gl);color:#065f46}
.opt.no{border-color:var(--red);background:var(--rl);color:#991b1b}
.opt:disabled{cursor:default}
.olet{width:22px;height:22px;border-radius:5px;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:var(--m)}
.qexp{margin-top:14px;padding:12px 14px;background:var(--bl);border-left:3px solid var(--blue);border-radius:0 var(--r2) var(--r2) 0;font-size:11px;color:#1e40af;line-height:1.6}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.btn{padding:8px 16px;border-radius:var(--r2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f);border:none;transition:all .15s}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue2)}
.btn-g{background:var(--sur);color:var(--t);border:1px solid var(--bd)}.btn-g:hover{background:var(--bg)}
.btn-r{background:var(--red);color:#fff}
.res{text-align:center;padding:32px 16px;max-width:440px;margin:0 auto}
.res-ring{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;font-family:var(--m)}
.res-g{font-size:20px;font-weight:700;margin-bottom:6px}
.res-s{font-size:12px;color:var(--t2);margin-bottom:20px;line-height:1.5}
.rbar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px}
.rblab{width:55px;color:var(--t2);font-size:10px}
.rbt{flex:1;height:6px;background:var(--bd);border-radius:3px}
.rbf{height:100%;border-radius:3px}
.rbp{width:32px;text-align:right;font-weight:600;font-family:var(--m);font-size:11px}
.hero{background:linear-gradient(135deg,#0f1623 0%,#162035 100%);border-radius:var(--r);padding:22px 26px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'M';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:90px;font-weight:800;color:#1a2540;pointer-events:none;font-family:var(--m)}
.hero h2{font-size:17px;font-weight:700;position:relative}
.hero p{font-size:11px;color:#6b7fa8;position:relative;margin-top:3px}
.hstats{display:flex;gap:20px;margin-top:14px;position:relative}
.hs .v{font-size:22px;font-weight:700;font-family:var(--m);color:#4d7cff}
.hs .l{font-size:10px;color:#4b5a78;margin-top:1px}
.exh{background:var(--sb);border-radius:var(--r);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;color:#fff}
.timer{font-family:var(--m);font-size:22px;font-weight:700;color:#4d7cff}
.timer.w{color:#fbbf24}.timer.d{color:#f87171}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc h3{font-size:12px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.tc ul{padding-left:15px}
.tc li{font-size:11px;color:var(--t2);margin-bottom:5px;line-height:1.5}
.tc li strong{color:var(--t)}
.mt-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mt-tab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--sur);color:var(--t2);transition:all .15s}
.mt-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fcnav{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.fnb{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r2);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--t2);transition:all .15s}
.fnb:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.fc-ctr{font-size:12px;font-weight:600;color:var(--t2);font-family:var(--m)}
.stat{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:14px;text-align:center}
.stat .v{font-size:22px;font-weight:700;font-family:var(--m)}
.stat .l{font-size:10px;color:var(--t2);margin-top:2px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.c0{color:#2563eb}.c1{color:#059669}.c2{color:#d97706}.c3{color:#7c3aed}
.c4{color:#dc2626}.c5{color:#0891b2}.c6{color:#be185d}.c7{color:#65a30d}
.b0::before{background:#2563eb}.b1::before{background:#059669}.b2::before{background:#d97706}.b3::before{background:#7c3aed}
.b4::before{background:#dc2626}.b5::before{background:#0891b2}.b6::before{background:#be185d}.b7::before{background:#65a30d}
.f0{background:#2563eb}.f1{background:#059669}.f2{background:#d97706}.f3{background:#7c3aed}
.f4{background:#dc2626}.f5{background:#0891b2}.f6{background:#be185d}.f7{background:#65a30d}
.loading-overlay{position:fixed;inset:0;background:var(--sb);display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;gap:14px}
.loading-overlay.hide{display:none}
.loading-spin{width:36px;height:36px;border:3px solid #1e2d47;border-top-color:#4d7cff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:#4b5a78;font-size:12px;font-family:var(--f)}
.loading-overlay .wu-lbl{font-size:10px;font-weight:700;color:#4d7cff;letter-spacing:2px;text-transform:uppercase}
.ls{position:fixed;inset:0;background:var(--sb);display:flex;align-items:center;justify-content:center;z-index:9999}
.ls.hide{display:none}
.lb{width:100%;max-width:400px;padding:0 24px}
.ll{text-align:center;margin-bottom:28px}
.ll .wu-b{display:inline-block;background:#162035;border:1px solid #1e2d47;border-radius:var(--r2);padding:6px 14px;font-size:10px;font-weight:700;color:#4d7cff;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.ll h1{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
.ll p{font-size:11px;color:#4b5a78;margin-top:3px}
.ltabs{display:flex;background:#162035;border-radius:var(--r2);padding:3px;margin-bottom:20px;border:1px solid #1e2d47}
.ltab{flex:1;padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#4b5a78;font-family:var(--f);transition:all .15s}
.ltab.on{background:var(--blue);color:#fff}
.lf{margin-bottom:12px}
.lf label{display:block;font-size:10px;font-weight:700;color:#7b8db0;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.lf input{width:100%;background:#162035;border:1px solid #1e2d47;border-radius:var(--r2);padding:10px 13px;font-size:13px;color:#fff;font-family:var(--f);outline:none;transition:border-color .15s}
.lf input:focus{border-color:var(--blue)}
.lf input::placeholder{color:#2e4068}
.lbtn{width:100%;background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;border-radius:var(--r2);padding:11px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--f);margin-top:4px;transition:opacity .15s}
.lbtn:hover{opacity:.88}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.lerr{background:#2a1010;border:1px solid #7f1d1d;border-radius:var(--r2);padding:9px 13px;font-size:12px;color:#fca5a5;margin-bottom:12px;display:none}
.lerr.show{display:block}
.lsuc{background:#0a2018;border:1px solid #065f46;border-radius:var(--r2);padding:9px 13px;font-size:12px;color:#6ee7b7;margin-bottom:12px;display:none}
.lsuc.show{display:block}
.ubadge{display:flex;align-items:center;gap:8px}
.uav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--t);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logoutb{font-size:11px;color:var(--t3);cursor:pointer;padding:3px 8px;border:1px solid var(--bd);border-radius:4px;background:none;font-family:var(--f);transition:all .15s}
.logoutb:hover{color:var(--red);border-color:var(--red)}
.imp-section{margin-bottom:24px}
.imp-section h3{font-size:13px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.imp-section p,.imp-section a{font-size:12px;color:var(--t2);line-height:1.7}
.imp-section a{color:var(--blue);text-decoration:none}
.imp-section a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="loading-overlay" id="lo">
<div class="loading-spin"></div>
<span class="wu-lbl">WU Wien · Marketing</span>
<p>App wird geladen…</p>
</div>
<div class="ls" id="ls">
<div class="lb">
<div class="ll">
<div class="wu-b">WU WIEN · MARKETING</div>
<h1>Marketing Lernapp</h1>
<p>Dein Lernbegleiter für die Klausur</p>
</div>
<div class="ltabs">
<button class="ltab on" id="lt-login" onclick="showLTab('login')">Anmelden</button>
<button class="ltab" id="lt-reg" onclick="showLTab('reg')">Registrieren</button>
</div>
<div id="lpanel-login">
<div class="lerr" id="lerr-login"></div>
<div class="lsuc" id="lsuc-login"></div>
<div class="lf"><label>E-Mail</label><input type="email" id="lin-email" placeholder="deine@email.at" autocomplete="email"></div>
<div class="lf"><label>Passwort</label><input type="password" id="lin-pw" placeholder="Passwort" autocomplete="current-password"></div>
<button class="lbtn" id="lbtn-login" onclick="doLogin()">Anmelden</button>
<p style="text-align:center;margin-top:10px;font-size:11px;color:#4b5a78">
<span style="cursor:pointer;color:#4d7cff" onclick="showLTab('reset')">Passwort vergessen?</span>
</p>
</div>
<div id="lpanel-reg" style="display:none">
<div class="lerr" id="lerr-reg"></div>
<div class="lsuc" id="lsuc-reg"></div>
<div class="lf"><label>Name</label><input type="text" id="rin-name" placeholder="Vorname Nachname"></div>
<div class="lf"><label>E-Mail</label><input type="email" id="rin-email" placeholder="deine@email.at" autocomplete="email"></div>
<div class="lf"><label>Passwort</label><input type="password" id="rin-pw" placeholder="Mind. 6 Zeichen" autocomplete="new-password"></div>
<button class="lbtn" id="lbtn-reg" onclick="doReg()">Registrieren</button>
</div>
<div id="lpanel-reset" style="display:none">
<div class="lerr" id="lerr-reset"></div>

function ri(it){
  if(it.y==='def') return `<div class="drow"><div class="dt">${it.k}</div><div class="dv">${it.v}</div></div>`;
  if(it.y==='h') return `<div class="sect-head">${it.v}</div>`;
  if(it.y==='trap') return `<div class="al trap"><span class="al-ic">⚠️</span><div>${it.v}</div></div>`;
  if(it.y==='tip') return `<div class="al tip"><span class="al-ic">💡</span><div>${it.v}</div></div>`;
  if(it.y==='info') return `<div class="al info"><span class="al-ic">ℹ️</span><div>${it.v}</div></div>`;
  if(it.y==='warn') return `<div class="al warn"><span class="al-ic">🔔</span><div>${it.v}</div></div>`;
  if(it.y==='step'){
    const detail=it.detail?`<div class="step-detail">${it.detail}</div>`:'';
    const q=it.q?`<div class="step-q">${it.q}</div>`:'';
    return `<div class="step-box"><div class="step-num">Schritt ${it.n}</div><strong>${it.t}</strong>${q}${detail}</div>`;
  }
  if(it.y==='formula') return `<div class="formula-box"><div class="formula-lbl">${it.lbl||''}</div>${it.v}${it.note?`<br><small>${it.note}</small>`:''}</div>`;
  if(it.y==='tbl'){
    const heads=it.heads?`<tr>${it.heads.map(h=>`<th>${h}</th>`).join('')}</tr>`:'';
    const rows=it.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table class="tbl"><thead>${heads}</thead><tbody>${rows}</tbody></table>`;
  }
  if(it.y==='kv'){
    const items=it.items.map(i=>`<div class="kv-item${i.c?' '+i.c:''}"><div class="kv-t">${i.k}</div><div class="kv-v">${i.v}</div></div>`).join('');
    return `<div class="kv-grid">${items}</div>`;
  }
  if(it.y==='badges'){
    const items=it.items.map(i=>`<span class="badge ${i.c||'b'}">${i.v}</span>`).join('');
    return `<div class="badge-row">${items}</div>`;
  }
  return '';
}

  {y:'def',k:'Produktlebenszyklus (PLC)',v:'Modell, das die typischen Absatz- und Gewinntentwicklungen eines Produkts über die Zeit beschreibt.'},
  {y:'tbl',heads:['Phase','Merkmal','Strategie'],rows:[
    ['<b>Einführung</b>','Langsames Wachstum, hohe Kosten, negativer Gewinn','Bekanntmachung, ggf. Skimming oder Penetration'],
    ['<b>Wachstum</b>','Schnell steigender Umsatz, Wettbewerber treten ein','Marktanteile sichern, Distribution ausbauen'],
    ['<b>Reife</b>','Wachstum verlangsamt, Gewinn max., starker Wettbewerb','Differenzierung, Kostenoptimierung'],
    ['<b>Sättigung</b>','Stagnation, Preiskampf','Marktpflege, Relaunches'],
    ['<b>Degeneration</b>','Sinkender Umsatz','Elimination oder Relaunch'],
  ]},
  {y:'trap',v:'<b>PLC ≠ Realität:</b> Nicht alle Produkte durchlaufen alle Phasen. Manche überspringen Phasen, kehren zurück oder haben atypische Kurven.'},
]},
{t:'Markenpolitik',items:[
  {y:'def',k:'Marke (Brand)',v:'Name, Begriff, Zeichen, Symbol oder Design, das die Produkte eines Anbieters von denen der Wettbewerber unterscheidet und identifizierbar macht.'},
  {y:'tbl',heads:['Markenstrategie','Beschreibung','Beispiel'],rows:[
    ['<b>Einzelmarkenstrategie</b>','Jedes Produkt hat eine eigene Marke','Ariel, Pampers (beide P&G)'],
    ['<b>Familienmarkenstrategie</b>','Eine Marke für eine Produktgruppe','Maggi (Knorr-Produkte)'],
    ['<b>Dachmarkenstrategie</b>','Eine Marke für alle Produkte','Siemens, Virgin'],
    ['<b>Handelsmarke</b>','Marke des Händlers (Private Label)','REWE Bio, Ja! (Rewe)'],
  ]},
  {y:'kv',items:[
    {k:'Markenwert (Brand Equity)',v:'Mehrwert, den eine Marke einem Produkt verleiht. Komponenten: Bekanntheit, Qualitätswahrnehmung, Markenloyalität, Assoziationen.'},
    {k:'Markenpositionierung',v:'Gezielter Aufbau eines klaren Markenbildes im Konsumentenbewusstsein.',c:'green'},
  ]},
]},
{t:'Innovationsmanagement',items:[
  {y:'def',k:'Innovation',v:'Erstmalige wirtschaftliche Nutzung einer Erfindung (Invention). Typen: Produktinnovation, Prozessinnovation, Geschäftsmodellinnovation.'},
  {y:'tbl',heads:['Phase des Innovationsprozesses','Inhalt'],rows:[
    ['<b>Ideengenerierung</b>','Kreativitätstechniken, Kundenfeedback, Mitarbeiterideen'],
    ['<b>Screening</b>','Bewertung und Auswahl von Ideen (Machbarkeit, Marktpotenzial)'],
    ['<b>Konzeptentwicklung</b>','Detaillierung und Produktkonzept-Test'],
    ['<b>Entwicklung & Test</b>','Prototyp, Markttest (z.B. Testmarkt)'],
    ['<b>Markteinführung</b>','Launch: Timing, Gebiet, Zielgruppe, Einführungsstrategie'],
  ]},
  {y:'kv',items:[
    {k:'Early Adopters',v:'Innovations-Erstnutzer. Laut Rogers: Innovatoren (2,5%) → Early Adopters (13,5%) → Early Majority (34%) → Late Majority (34%) → Laggards (16%).'},
    {k:'Chasm (Abgrund)',v:'Kritische Lücke zwischen Early Adopters und Early Majority bei disruptiven Innovationen.',c:'amber'},
  ]},
]},
]},
{mod:5,chs:[
{t:'Preispolitik — Grundlagen & Ziele',items:[
  {y:'def',k:'Preispolitik',v:'Alle Entscheidungen, die die Festlegung von Preisen und Konditionen für Produkte und Dienstleistungen betreffen. Der Preis ist das einzige P, das direkt Umsatz generiert.'},
  {y:'tbl',heads:['Preisziel','Beispiele'],rows:[
    ['<b>Gewinn-/Rendite-Ziele</b>','Gewinnmaximierung, ROI, Deckungsbeitrag'],
    ['<b>Absatz-/Marktanteilsziele</b>','Marktanteile sichern, Absatzsteigerung'],
    ['<b>Wettbewerbsziele</b>','Marktführerschaft, Verdrängung'],
    ['<b>Kundenziele</b>','Qualitätsimage, Kundenzufriedenheit'],
  ]},
  {y:'trap',v:'<b>Preis ist das stärkste Marketinginstrument!</b> Eine Preiserhöhung um 1% kann den Gewinn um 10%+ steigern (vgl. McKinsey). Gleichzeitig: Preisänderungen sind leicht imitierbar!'},
]},
{t:'Preisfindungsmethoden',items:[
  {y:'tbl',heads:['Methode','Beschreibung','Vorteil'],rows:[
    ['<b>Kostenorientiert</b>','Kosten + Aufschlag (Cost-Plus) oder Break-Even-Pricing','Einfach, sicher'],
    ['<b>Nachfrageorientiert</b>','Preis nach Zahlungsbereitschaft der Kunden (Value-Based)','Schöpft Wert ab'],
    ['<b>Wettbewerbsorientiert</b>','Preis am Markt ausrichten (Going-Rate Pricing)','Marktkonform'],
  ]},
  {y:'formula',lbl:'Break-Even-Menge',v:'x* = Kf / (p − kv)',note:'Kf = Fixkosten, p = Preis, kv = variable Stückkosten'},
  {y:'formula',lbl:'Break-Even-Umsatz',v:'U* = Kf / (1 − kv/p) = Kf / Deckungsbeitragssatz'},
  {y:'trap',v:'<b>Deckungsbeitrag (DB) = p − kv.</b> Solange DB > 0, lohnt sich die Produktion kurzfristig! Langfristig muss DB alle Fixkosten decken.'},
]},
{t:'Preiselastizität der Nachfrage',items:[
  {y:'def',k:'Preiselastizität (η)',v:'Misst die prozentuale Änderung der Nachfrage bei einer 1%igen Preisänderung.'},
  {y:'formula',lbl:'Preiselastizität',v:'η = (ΔQ/Q) / (ΔP/P) = (ΔQ/ΔP) · (P/Q)',note:'|η| > 1 = elastisch; |η| < 1 = unelastisch; |η| = 1 = einheitselastisch'},
  {y:'tbl',heads:['Elastizität','Bedeutung','Beispiel'],rows:[
    ['<b>Elastisch (|η|>1)</b>','Preiserhöhung → Umsatzrückgang','Luxusgüter, Markenartikel mit Alternativen'],
    ['<b>Unelastisch (|η|<1)</b>','Preiserhöhung → Umsatzsteigerung','Lebensnotwendige Güter, Zigaretten'],
    ['<b>Einheitselastisch</b>','Preisänderung → kein Umsatzeffekt','Theor. Spezialfall'],
  ]},
  {y:'trap',v:'<b>VORZEICHEN:</b> η ist fast immer negativ (Preiserhöhung → weniger Nachfrage). In der Praxis wird oft der Absolutbetrag |η| verwendet!'},
]},
{t:'Preisstrategien',items:[
  {y:'tbl',heads:['Strategie','Beschreibung','Einsatz'],rows:[
    ['<b>Skimming (Abschöpfung)</b>','Hoher Einführungspreis, der schrittweise sinkt','Innovationen, technische Produkte'],
    ['<b>Penetration</b>','Niedriger Einführungspreis für schnelle Marktdurchdringung','Neue Märkte, starker Wettbewerb'],
    ['<b>Prestige-Pricing</b>','Dauerhaft hoher Preis als Qualitätssignal','Luxusgüter'],
    ['<b>Bündelpreise</b>','Mehrere Produkte zusammen günstiger','Software-Suiten, Menüs'],
  ]},
  {y:'kv',items:[
    {k:'Preisdifferenzierung',v:'Verschiedene Preise für gleiche/ähnliche Produkte: zeitlich (Happy Hour), räumlich (Länder), personell (Studenten), mengenmäßig.'},
    {k:'Yield Management',v:'Dynamische Preise je nach Nachfrage/Zeit. Bsp: Flugtickets, Hotelzimmer.',c:'green'},
  ]},
]},
{t:'Preispsychologie & Konditionenpolitik',items:[
  {y:'def',k:'Konditionenpolitik',v:'Gestaltung der Zahlungs- und Lieferungsbedingungen: Rabatte, Skonti, Boni, Zahlungsfristen.'},
  {y:'tbl',heads:['Psychologischer Effekt','Erklärung'],rows:[
    ['<b>Preisschwelle</b>','9,99 € wirkt günstiger als 10,00 € (Odd Pricing)'],
    ['<b>Referenzpreis</b>','Konsumenten vergleichen Preise mit einem internen Referenzwert'],
    ['<b>Qualitätssignal</b>','Hoher Preis = hohe Qualität (gilt v.a. bei Informationsasymmetrie)'],
    ['<b>Ankereffekt</b>','Zuerst genannter Preis beeinflusst alle weiteren Urteile'],
  ]},
  {y:'kv',items:[
    {k:'Skonto',v:'Preisnachlass bei sofortiger Zahlung (z.B. 2% bei Zahlung innert 10 Tagen).'},
    {k:'Mengenrabatt',v:'Günstigerer Preis bei Abnahme größerer Mengen.',c:'green'},
  ]},
]},
]},
{mod:6,chs:[
{t:'Distributionspolitik — Definition, Ziele & Aspekte',items:[
  {y:'def',k:'Distributionspolitik',v:'Umfasst alle Entscheidungen, die die <b>Verteilung der (im)materiellen Leistungen</b> vom Hersteller zum Endkäufer betreffen. Zentral: <b>Transaktionsfunktion</b> = wirtschaftlich-rechtliche Übertragung von Verfügungsmacht über eine Leistung an den Endkäufer.'},
  {y:'h',v:'Distributionspolitische Ziele:'},
  {y:'badges',items:[
    {v:'Reduzierung der Vertriebskosten & Handelsspannen',c:'b'},
    {v:'Erhöhung des Distributionsgrades',c:'b'},
    {v:'Kooperation mit Absatzmittlern',c:'b'},
    {v:'Auswahl kompetenter & passender Absatzmittler (Image der Absatzkanäle)',c:'b'}
  ]},
  {y:'h',v:'3 Aspekte der Distributionspolitik:'},
  {y:'tbl',heads:['Ebene','Inhalt'],rows:[
    ['<b>I. Markttransaktionen</b>','Marktbasierter Ansatz (MBV) + Konsumentenverhaltensbasierter Ansatz (CBV)'],
    ['<b>II. Entscheidungsprozesse</b>','Kaufentscheidungen der Nachfrager (Netto-Nutzen-Vorteil) ↔ Marketingentscheidungen der Anbieter (Wettbewerbsvorteil): Absatzkanalmgmt. + Marketinglogistik'],
    ['<b>III. Wertebene</b>','Kunden- u. Markenwert ↔ Stakeholder Value ↔ Unternehmenswert'],
  ]},
  {y:'h',v:'2 Teilsysteme der Distributionspolitik:'},
  {y:'kv',items:[
    {k:'Absatzkanalsystem',v:'Direkter Weg (Hersteller → Konsument) ODER indirekter Weg über <b>Absatzmittler</b> (Einzelhändler, Großhändler, Jobber). Absatzmittler = <b>EIGENTUMSÜBERGANG!</b>'},
    {k:'Logistiksystem',v:'Physische Distribution durch <b>Absatzhelfer</b> (z.B. Spediteur LKW Walter). Absatzhelfer = <b>KEIN Eigentumsübergang!</b>',c:'amber'},
  ]},
  {y:'trap',v:'<b>SCHLÜSSELUNTERSCHIED:</b> Absatzmittler (Groß-/Einzelhändler) = <b>EIGENTUMSÜBERGANG!</b> Absatzhelfer (Spediteur, Makler, Bank) = <b>KEIN Eigentumsübergang.</b>'},
]},
{t:'Absatzkanalmanagement & Konfliktursachen',items:[
  {y:'def',k:'Absatzkanalmanagement',v:'Systemische Planung, Koordinierung, Durchsetzung und Kontrolle <b>aller Maßnahmen, die auf das Absatzkanalsystem gerichtet sind</b>.'},

]},

{t:'Betriebstypen: Facheinzelhandel',items:[
  {y:'tbl',heads:['Betriebstyp','Merkmale'],rows:[
    ['<b>Fachgeschäft</b>','Breites Warenangebot EINER Branche. Persönliche Bedienung und Beratung. Bsp: Intersport, Hartlauer.'],
    ['<b>Spezialgeschäft</b>','Schmales, TIEFES Sortiment aus dem Warenangebot einer Branche. Konzentration auf spezifische Produktgruppe. Fachkundige Beratung. Bsp: Hutgeschäft, Angelshop.'],
    ['<b>Fachmarkt</b>','Breites Warenangebot einer Branche. An verkehrsgünstigen Standorten (Parkplätze). Niedriger Anteil an Personal- und Raumkosten. Bsp: OBI (Baumarkt), IKEA.'],
  ]},
  {y:'trap',v:'<b>Fachgeschäft ≠ Fachmarkt!</b> Fachgeschäft = persönliche Beratung, eher kein Selbstbedienungscharakter. Fachmarkt = verkehrsgünstige Lage, niedriger Personalkostenanteil.'},
  {y:'tip',v:'<b>Merkhilfe:</b> Spezialgeschäft = schmal aber tief (wenige Produkte, viele Varianten). Fachgeschäft = breit einer Branche + persönliche Beratung. Fachmarkt = breit + günstige Lage + wenig Personal.'}
]},
{t:'Betriebstypen: Gemischtwarenhandel',items:[
  {y:'tbl',heads:['Betriebstyp','Merkmale'],rows:[
    ['<b>Tante-Emma-Laden</b>','Klassischer Einkaufsladen. Umsatz <125.000€/Jahr. Gezielte Sortimentspolitik. Besondere Öffnungszeiten.'],
    ['<b>Supermarkt</b>','Fläche 400–800 m². Lebensmittel + begrenztes Non-Food-Angebot. 5.000–7.000 Artikel. In Wohngebieten.'],
    ['<b>Verbrauchermarkt</b>','Großbetrieb. Vollsortiment Food + Non-Food (kurz-/mittelfristiger Bedarf). 28.000–32.000 Produkte. Verkehrsgünstig.'],
    ['<b>Discounter</b>','Kostengünstige Lage. Aggressive Preispolitik. Verkaufsfläche = Lagerfläche (kein separates Lager!). Bsp: Lidl, Hofer.'],
    ['<b>Kauf-/Warenhaus</b>','Große Sortimentsbreite. Jede Produktlinie bildet eine Abteilung. Eher Selbstbedienung. In der Innenstadt.'],
    ['<b>Off-Price-Retailer</b>','Kein gleichbleibendes Sortiment. Schnäppchen (Saisonware, Restposten, Konkursware). Spezialfall: Factory Outlet.'],
  ]},
  {y:'info',v:'<b>Zahlenwissen für Klausur:</b> Supermarkt: 400–800 m², 5.000–7.000 Artikel. Verbrauchermarkt: 28.000–32.000 Produkte. Tante-Emma: Umsatz <125.000€/Jahr.'}
]},
{t:'Anzahl der Absatzmittler — 3 Distributionsstrategien',items:[
  {y:'tbl',heads:['Strategie','Beschreibung','Produkte'],rows:[
    ['<b>Intensive Distribution</b>','Produkte müssen überall verfügbar sein → so viele Händler wie möglich.','Massenartikel (Coca-Cola, Milch, Zeitungen)'],
    ['<b>Selektive Distribution</b>','Bestimmte Anzahl von Händlern, zu denen eine enge Geschäftsbeziehung aufgebaut wird.','Mittlere Qualität (Marken-Sportartikel, Elektronikartikel)'],
    ['<b>Exklusive Distribution</b>','Alleinverkaufsrechte für bestimmtes Gebiet. Verpflichtung, keine konkurrierenden Produkte zu führen.','Luxusgüter (Rolex, Ferrari, Porsche)'],

{t:'Kontraktkonzept & Vertragshändlersystem',items:[
  {y:'def',k:'Kontraktkonzept',v:'Im Mittelpunkt steht die <b>vertragliche Ausgestaltung der Beziehung</b> zu den Absatzmittlern. Zusammenarbeit grundsätzlich auch ohne Vertrag möglich; jedoch Trend zum Vertrag.'},

  {y:'tbl',heads:['Merkmal','Vertragshändler','Handelsvertreter'],rows:[

{t:'Franchisesystem — vollständig',items:[
  {y:'def',k:'Franchising',v:'Vertikal-kooperativ organisiertes Vertriebssystem, basierend auf vertraglichem Dauerschuldverhältnis. Umfassend geregelte langfristige Beziehung zwischen Franchisegeber und rechtlich selbständigen Franchisenehmern.'},

{t:'Push/Pull-Strategie (Stimulierungskonzept)',items:[
  {y:'def',k:'Stimulierungskonzept',v:'Maßnahmen, um Absatzmittler aus Herstellersicht zu einem <b>zielkonformen Handeln</b> zu bewegen.'},
  {y:'kv',items:[
    {k:'Push-Strategie',v:'Hersteller bietet Absatzmittlern Anreize → Händler gelistet → Händler verkauft weiter. <b>Händlergerichtete</b> Anreize (z.B. Handelsspannen, Funktionsrabatte, Displays). In der Praxis: oft Kombination!'},
    {k:'Pull-Strategie',v:'Hersteller spricht Nachfrager direkt durch eigene Kommunikationsmaßnahmen an → Nachfrager fragt beim Händler nach → Händler gezwungen zu listen. <b>Endkundengerichtete</b> Werbung.',c:'green'},

  {y:'trap',v:'<b>Messen</b> (B2B, FACHBESUCHER) ≠ <b>Ausstellungen</b> (B2C, ALLGEMEINES PUBLIKUM).'}

{t:'Supply Chain Management (SCM) & ECR',items:[
  {y:'def',k:'Supply Chain (Lieferkette)',v:'= Gesamter Wertschöpfungsprozess vom Lieferanten der Lieferanten bis zum Endverbraucher, einschließlich aller Absatzmittler und Absatzhelfer.'},
  {y:'def',k:'Supply Chain Management (SCM)',v:'Optimierung der <b>gesamten Lieferkette</b>, vor allem der Schnittstellen zwischen einzelnen Akteuren. Umfasst: Beschaffungs-/Lieferantenmanagement + Vertrieb und Auftragsabwicklung.'},
  {y:'kv',items:[
    {k:'Beschaffungs- & Lieferantenmanagement',v:'Lieferanten der Lieferanten → Lieferanten 1/2/3 → Endprodukthersteller. Optimierung der Einkaufsseite.'},
    {k:'Vertrieb und Auftragsabwicklung',v:'Endprodukthersteller → Absatzmittler → Absatzhelfer → Endverbraucher. Optimierung der Verkaufsseite.',c:'green'},
  ]},
  {y:'def',k:'Efficient Consumer Response Management (ECR)',v:'Managementkonzept aus den USA der 1990er. Sicherstellung einer effizienten Reaktion auf Konsumentenwünsche basierend auf einer <b>kooperativen Partnerschaft zwischen Hersteller und Absatzmittler</b>. Konzentriert sich im Gegensatz zu SCM NUR auf Prozesse zwischen Hersteller und Absatzmittler.'},
  {y:'tbl',heads:['Merkmal','SCM','ECR'],rows:[
    ['Fokus','Gesamte Lieferkette','Nur Hersteller ↔ Absatzmittler'],
    ['Perspektiven','Logistik + Beschaffung + Vertrieb','Nachfragerperspektive + Logistikperspektive'],
    ['Ziel','Optimierung aller Schnittstellen','Effiziente Reaktion auf Konsumentenwünsche'],
    ['Entstehung','—','USA, 1990er Jahre'],
  ]},
  {y:'trap',v:'<b>SCM vs. ECR:</b> SCM = optimiert die GESAMTE Lieferkette. ECR = konzentriert sich NUR auf die Schnittstelle Hersteller ↔ Absatzmittler.'}
]}
]},

const CARDS=[
  {m:0,t:'Marketing (Definition)',d:'Konzept der marktorientierten Unternehmensführung. Ausrichtung aller Aktivitäten an den Bedürfnissen der Märkte zur Erreichung der Unternehmensziele. Kunden- und Wettbewerbsorientierung als Kernprinzip.'},
  {m:0,t:'4P des Marketing',d:'Product (Produkt) · Price (Preis) · Place (Distribution) · Promotion (Kommunikation). Die klassischen 4 Marketinginstrumente.'},
  {m:0,t:'MBV vs. RBV vs. CBV',d:'MBV = Market-Based View (externe Positionierung, Porter). RBV = Resource-Based View (interne Stärken, Barney). CBV = Consumer-Behavior View (Konsumentenverständnis).'},
  {m:0,t:'Käufermarkt vs. Verkäufermarkt',d:'Käufermarkt: Angebot > Nachfrage → Konsument hat Macht. Verkäufermarkt: Nachfrage > Angebot → Anbieter hat Macht.'},
  {m:0,t:'B2C vs. B2B',d:'B2C = Business to Consumer (Endkunde, emotionalere Entscheidungen). B2B = Business to Business (Unternehmenskunde, rationalere, komplexere Kaufentscheidungen).'},
  {m:1,t:'Elaboration Likelihood Model (ELM)',d:'Zwei Routen der Überzeugung: Zentrale Route (hohes Involvement, Argumente) → dauerhafte Einstellungsänderung. Periphere Route (niedriges Involvement, Heuristiken) → oberflächliche Änderung.'},
  {m:1,t:'Kaufentscheidungstypen',d:'Extensiv (komplex, hohes Involvement) · Limitiert (vereinfacht, Heuristiken) · Habituell (Gewohnheit) · Impuls (spontan, emotional). Mit steigendem Involvement wird der Prozess aufwendiger.'},
  {m:1,t:'5 Phasen des Kaufentscheidungsprozesses',d:'(1) Problemerkennung. (2) Informationssuche. (3) Alternativenbewertung (Evoked Set). (4) Kaufentscheidung. (5) Nachkaufverhalten (kognitive Dissonanz).'},
  {m:1,t:'Kognitive Dissonanz',d:'Nachkauf-Unsicherheit und Zweifel an der getroffenen Entscheidung. Marketing-Reaktion: positive Bestätigung nach dem Kauf (Dankes-E-Mails, Bewertungen zeigen).'},
  {m:2,t:'Primär- vs. Sekundärforschung',d:'Primär: neue Daten erheben (teuer, aktuell, spezifisch). Sekundär: vorhandene Daten nutzen (günstig, schnell, weniger spezifisch).'},
  {m:2,t:'Gütekriterien der Messung',d:'Validität (misst was es messen soll) · Reliabilität (stabile, wiederholbare Messung) · Objektivität (unabhängig vom Forscher). Alle drei müssen erfüllt sein.'},
  {m:2,t:'Qualitativ vs. Quantitativ',d:'Qualitativ = Verstehen, explorativ (Tiefeninterviews, Fokusgruppen, kleine Stichproben). Quantitativ = Messen, bestätigend (Fragebogen, große Stichproben, statistisch auswertbar).'},
  {m:3,t:'SWOT-Analyse',d:'Strengths + Weaknesses = intern (controllable). Opportunities + Threats = extern (uncontrollable). SO=Ausbaustrategie · ST=Diversifikation · WO=Aufholstrategie · WT=Defensivstrategie.'},
  {m:3,t:'Porters 3 Wettbewerbsstrategien',d:'(1) Kostenführerschaft (niedrigster Preis). (2) Differenzierung (Einzigartigkeit). (3) Fokus/Nische (Spezialisierung). Stuck in the Middle = keine klare Strategie = gefährlich!'},
  {m:3,t:'Ansoff-Matrix',d:'Marktdurchdringung (bestehend/bestehend, niedrigstes Risiko) · Marktentwicklung (neu/bestehend) · Produktentwicklung (bestehend/neu) · Diversifikation (neu/neu, höchstes Risiko).'},
  {m:3,t:'Marktsegmentierung — Kriterien',d:'Demografisch (Alter, Einkommen) · Geografisch (Land, Region) · Psychografisch (Lebensstil, Werte) · Verhaltensorientiert (Kaufhäufigkeit, Markentreue).'},
  {m:3,t:'Positionierung — POD vs. POP',d:'POD (Point of Difference) = einzigartiges Unterscheidungsmerkmal ggü. Wettbewerb. POP (Point of Parity) = Hygienefaktoren, die Konsumenten in der Kategorie erwarten.'},
  {m:4,t:'Die 3 Produktebenen',d:'Kernprodukt (Grundnutzen/wahrer Kaufgrund) · Reales Produkt (physische Ausgestaltung: Qualität, Design, Marke) · Erweitertes Produkt (Zusatzleistungen: Garantie, Service).'},
  {m:4,t:'Produktlebenszyklus (PLC)',d:'5 Phasen: Einführung (neg. Gewinn) → Wachstum (Gewinn steigt) → Reife (max. Gewinn) → Sättigung (stagnierend) → Degeneration (sinkend). Nicht alle Produkte durchlaufen alle Phasen!'},
  {m:4,t:'Markenstrategie — 4 Typen',d:'Einzelmarkenstrategie (jedes Produkt eigene Marke, z.B. P&G) · Familienmarkenstrategie · Dachmarkenstrategie (alle Produkte eine Marke) · Handelsmarke (Private Label des Händlers).'},
  {m:4,t:'Diffusion of Innovation (Rogers)',d:'Innovatoren (2,5%) → Early Adopters (13,5%) → Early Majority (34%) → Late Majority (34%) → Laggards (16%). Chasm = kritische Lücke zwischen Early Adopters und Early Majority.'},
  {m:5,t:'Break-Even-Analyse',d:'x* = Kf / (p − kv). Kf = Fixkosten, p = Preis, kv = variable Stückkosten. Bei x* ist Gewinn = 0. DB = p − kv (Deckungsbeitrag pro Stück). Klausurstoff!'},
  {m:5,t:'Preiselastizität der Nachfrage',d:'η = (ΔQ/Q) / (ΔP/P). |η| > 1 = elastisch (Preiserhöhung → Umsatz sinkt). |η| < 1 = unelastisch (Preiserhöhung → Umsatz steigt). η ist fast immer negativ!'},
  {m:5,t:'Skimming vs. Penetration',d:'Skimming = hoher Einführungspreis, der sinkt (für Innovationen, technische Produkte). Penetration = niedriger Einführungspreis für schnelle Marktdurchdringung (neue Märkte, starker Wettbewerb).'},
  {m:5,t:'Preisdifferenzierung',d:'Verschiedene Preise für gleiche/ähnliche Produkte: zeitlich (Happy Hour, Off-Peak), räumlich (Länderpreise), personell (Studentenrabatt), mengenmäßig (Mengenrabatt).'},
  {m:5,t:'Konditionenpolitik',d:'Rabatte (Mengen-, Treue-, Aktionsrabatt) · Skonto (Preisnachlass bei schneller Zahlung, z.B. 2/10 netto 30) · Boni (nachträgliche Vergütungen) · Zahlungsfristen.'},
  {m:6,t:'Absatzmittler vs. Absatzhelfer',d:'Absatzmittler (Groß-/Einzelhändler) = EIGENTUMSÜBERGANG! Sie kaufen und verkaufen die Ware. Absatzhelfer (Spediteur, Makler, Bank) = KEIN Eigentumsübergang. Sie unterstützen nur.'},
  {m:6,t:'Intensive vs. Exklusive Distribution',d:'Intensive Distribution = Produkte überall verfügbar (Massenartikel). Selektive Distribution = ausgewählte Händler. Exklusive Distribution = Alleinverkaufsrecht + keine Konkurrenzprodukte (Luxusgüter).'},
  {m:6,t:'Franchisesystem',d:'Umfassend geregelte langfristige Beziehung. Franchisegeber erlaubt Nutzung von Name/Warenzeichen/Ausstattung. Franchisenehmer (rechtlich selbständig) zahlt fixe Eintrittsgebühr + variable Zahlungen.'},
  {m:6,t:'Push vs. Pull',d:'Push: Hersteller überzeugt Händler. Pull: Werbung an Endkunden zwingt Händler zur Listung.'},
  {m:6,t:'Distributionspolitik (Definition)',d:'Alle Entscheidungen über Verteilung der (im)materiellen Leistungen vom Hersteller zum Endkäufer. Zentral: Transaktionsfunktion = wirtschaftlich-rechtliche Übertragung von Verfügungsmacht.'},
  {m:6,t:'4 Distributionspolitische Ziele',d:'(1) Reduzierung Vertriebskosten/Handelsspannen. (2) Erhöhung Distributionsgrad. (3) Kooperation mit Absatzmittlern. (4) Auswahl kompetenter/passender Absatzmittler (Image der Absatzkanäle).'},
  {m:6,t:'Absatzkanalmanagement — 4 Aufgaben',d:'Systemische Planung · Koordinierung · Durchsetzung · Kontrolle. = Alle Maßnahmen, die auf das Absatzkanalsystem gerichtet sind.'},
  {m:6,t:'4 Konfliktursachen im Absatzkanalsystem',d:'Z-R-M-K: Zielbeziehungen (Zieldivergenzen Hersteller/Handel), Rollenbeziehungen (konfliktäre Erwartungen Marketingfunktionen), Machtbeziehungen (Machtkonzentration im Handel), Kommunikationsbeziehungen (Informationsvorsprung einer Partei).'},
  {m:6,t:'3 Gründe für Absatzmittler (Herstellersicht)',d:'(1) Fehlen von Finanzmitteln für Direktvertrieb. (2) Flächendeckende Warendistribution sicherstellen. (3) Investition in Kerngeschäft ermöglichen.'},
  {m:6,t:'Aufgaben der Absatzmittler',d:'(1) Bildung von Warensortimenten. (2) Überbrückungsfunktion (Menge, Zeit, Ort). (3) (Vor-)Finanzierungsfunktion. Vorteile für Konsumenten: breiteres Warenangebot + haushaltsübliche Mengen.'},
  {m:6,t:'Selektionsprozess',d:'Legt die grundsätzliche Struktur der Absatzkanäle fest: Entscheidungen über direkten oder indirekten Vertrieb sowie Art und Anzahl der Absatzmittler.'},
  {m:6,t:'Direkter Vertrieb — 6 Formen',d:'Haus-zu-Haus Verkauf · Partyverkauf · Katalogverkauf · Verkaufsfilialen · Teleshopping · Onlineshopping. Kein Absatzmittler dazwischen!'},
  {m:6,t:'Fachgeschäft vs. Spezialgeschäft vs. Fachmarkt',d:'Fachgeschäft = breit einer Branche + persönliche Beratung. Spezialgeschäft = schmal, tief + fachkundige Beratung. Fachmarkt = breit, verkehrsgünstig, niedriger Personalkostenanteil.'},
  {m:6,t:'Supermarkt & Verbrauchermarkt — Kennzahlen',d:'Supermarkt: 400–800 m², 5.000–7.000 Artikel, in Wohngebieten. Verbrauchermarkt: Großbetrieb, 28.000–32.000 Produkte, verkehrsgünstig. Tante-Emma: Umsatz <125.000€/Jahr.'},
  {m:6,t:'Discounter vs. Kauf-/Warenhaus',d:'Discounter: kostengünstige Lage, aggressive Preispolitik, Verkaufsfläche = Lagerfläche. Kauf-/Warenhaus: große Sortimentsbreite, jede Produktlinie = Abteilung, Selbstbedienung, Innenstadt.'},
  {m:6,t:'Off-Price-Retailer',d:'Kein gleichbleibendes Sortiment. Bietet Schnäppchen (Saisonware, Restposten, Konkursware). Spezialfall: Factory Outlet (Direktverkauf des Herstellers zu günstigen Preisen).'},
  {m:6,t:'Vertikalisierung — Vorwärts vs. Rückwärts',d:'Rückwärtsintegration: Händler übernimmt Herstellerfunktionen (Akquisition Lieferant, eigene Produktion, Eigenmarken). Vorwärtsintegration: Hersteller übernimmt Distributionsaufgaben (Shop-in-Shop, Franchise, Factory Outlet, eigene Filialen).'},
  {m:6,t:'Vorwärtsintegration — Chancen & Risiken',d:'Chancen: Prozesseffizienz, Markenauftritt am PoS stärken, bessere Preisrealisierung, Zugang zum Nachfrager, Ausbau Verkaufsoberfläche. Risiken: Investitionsbedarf, strategische Risiken, operative Risiken.'},
  {m:6,t:'Mehrkanalvertrieb — Chancen vs. Risiken',d:'Chancen: bessere Kundenbetreuung, Cross-Selling, schwer imitierbarer Wettbewerbsvorteil, identitätskonforme Markenpräsentation. Risiken: verringertes Vertriebsengagement, hoher Koordinationsaufwand, Markenimagekonfusion.'},
  {m:6,t:'Kontraktkonzept + 3 Klassen Vertriebsbindung',d:'Kontraktkonzept = vertragliche Ausgestaltung der Beziehung zu Absatzmittlern. Vertriebsbindung (3 Klassen): (1) Räumlich (Absatzgebiet). (2) Personell (Kundenbeschränkung). (3) Zeitbezogen (max. Lagerzeiten, Auslieferung).'},
  {m:6,t:'Vertragshändlersystem',d:'Vertragshändler = kauft Vertragsware im EIGENEN Namen und auf EIGENE Rechnung. Verpflichtende Absatzförderung gemäß Herstellerinteressen. Verwendet Herstellerzeichen. = Absatzmittler (Eigentumsübergang!). ≠ Handelsvertreter (Absatzhelfer)!'},
  {m:6,t:'3 Grundtypen des Franchising',d:'(1) Herstellergeführtes Einzelhändler-Franchising (regionale Händlerbetriebe, z.B. VW). (2) Herstellergeführtes Großhändler-Franchising (Hersteller stellt Know-how, z.B. Coca-Cola Abfüller). (3) Dienstleistungs-Franchising EH-Stufe (Lizenzvergabe, z.B. McDonald&#39;s).'},
  {m:6,t:'5 konstitutive Merkmale Franchising',d:'System (Systemcharakter) · Vertrag (konstituierende Vereinbarungen) · Status (Stellung der Systempartner) · Marketing (Marktauftritt) · Funktionen (Aufgabenverteilung).'},
  {m:6,t:'6 Erfolgsfaktoren Franchising',d:'(1) Franchise-Markenwert. (2) Kosten des Franchise-Eintritts. (3) Finanzielles Ergebnis. (4) Wachstumspotenzial und Überlebensdauer. (5) Innovationsfähigkeit. (6) Persönliche Faktoren.'},
  {m:6,t:'SCM vs. ECR',d:'SCM = Supply Chain Management: Optimierung der GESAMTEN Lieferkette (alle Schnittstellen von Lieferanten bis Endkunde). ECR = Efficient Consumer Response: NUR Prozesse zwischen Hersteller und Absatzmittler. ECR: Nachfrager- + Logistikperspektive. Aus USA, 1990er.'},
  {m:7,t:'Kognitive → Affektive → Konative Ziele',d:'"Was weiß?" → "Wie fühlt?" → "Was tut der Kunde?" Reihenfolge wichtig: erst Bekanntheit (kognitiv), dann Einstellung (affektiv), dann Verhalten (konativ).'},
  {m:7,t:'Above-the-Line vs. Below-the-Line',d:'Above-the-Line = klassische Massenmedien (TV, Radio, Print, Outdoor). Below-the-Line = direkte, zielgerichtete Maßnahmen (Direct Mail, Events, Sponsoring, PR).'},
  {m:7,t:'Reichweite vs. OTS',d:'Reichweite = Anteil der Zielpersonen, die eine Werbebotschaft mind. 1x wahrnehmen (%). OTS (Opportunity to See) = durchschnittliche Kontakthäufigkeit mit einer Werbebotschaft.'},
  {m:7,t:'PR vs. Werbung',d:'PR = nicht bezahlt, daher glaubwürdiger, zielt auf Image/Vertrauen, Zielgruppe: breite Öffentlichkeit. Werbung = bezahlt, kontrollierte Botschaft, direktes Absatzziel.'},
  {m:7,t:'Messen vs. Ausstellungen',d:'Messen = Fachbesucher (B2B), Geschäftsanbahnung, Networking, Wettbewerbsbeobachtung. Ausstellungen = allgemeines Publikum (B2C), Markenimage, breite Wirkung.'},
];
const QQ=[
  {m:0,q:'Was ist der Hauptunterschied zwischen B2C und B2B?',o:['B2C ist teurer als B2B','B2C richtet sich an Endkonsumenten; B2B an Unternehmen','B2B hat weniger Wettbewerb','B2C gibt es nur im Internet'],a:1,e:'B2C = Business to Consumer (Endkunde, emotionalere Entscheidungen, größere Zielgruppe). B2B = Business to Business (Unternehmenskunde, rationalere, komplexere Kaufentscheidungen mit mehreren Entscheidern).'},
  {m:0,q:'Was beschreibt der Resource-Based View (RBV)?',o:['Wettbewerbsvorteil durch externe Marktpositionierung','Wettbewerbsvorteil durch interne Ressourcen und Kernkompetenzen','Wettbewerbsvorteil durch Konsumentenverständnis','Wettbewerbsvorteil durch niedrige Preise'],a:1,e:'RBV (Resource-Based View, Barney): Wettbewerbsvorteile entstehen durch einzigartige, schwer imitierbare interne Ressourcen und Kompetenzen. Im Gegensatz: MBV (Porter) = externe Marktpositionierung.'},
  {m:0,q:'Was sind die 4P des Marketing-Mix?',o:['Preis, Promotion, People, Process','Product, Price, Place, Promotion','Planning, Positioning, Profit, Performance','Produkt, Preis, Prozess, Publikum'],a:1,e:'Die klassischen 4P: Product (Produkt), Price (Preis), Place (Distribution/Vertrieb), Promotion (Kommunikation). Alle 4 Instrumente müssen aufeinander abgestimmt sein (Marketing-Mix).'},
  {m:1,q:'Was unterscheidet die zentrale von der peripheren Route im ELM?',o:['Beide Routen führen zu gleichen Ergebnissen','Zentrale Route = Argumente → dauerhaft; Periphere Route = Heuristiken → oberflächlich','Periphere Route ist effektiver als zentrale Route','Zentrale Route ist nur für B2B relevant'],a:1,e:'Elaboration Likelihood Model (Petty & Cacioppo): Zentrale Route = hohes Involvement, starke Argumente → dauerhafte Einstellungsänderung. Periphere Route = niedriges Involvement, Heuristiken (Attraktivität, Expertise) → oberflächliche, weniger stabile Überzeugung.'},
  {m:1,q:'Was ist kognitive Dissonanz?',o:['Unwissenheit über ein Produkt','Nachkauf-Unsicherheit und Zweifel an der Kaufentscheidung','Entscheidungsschwierigkeiten vor dem Kauf','Preisvergleich nach dem Kauf'],a:1,e:'Kognitive Dissonanz = Nachkauf-Unbehagen und Zweifel ("War das wirklich die richtige Entscheidung?"). Marketing-Reaktion: positive Bestätigung nach dem Kauf (Dankesmail, positive Bewertungen zeigen, Garantien).'},
  {m:1,q:'Welcher Kaufentscheidungstyp involviert die intensivste Informationssuche?',o:['Impulsiver Kauf','Habitueller Kauf','Extensiver Kauf','Limitierter Kauf'],a:2,e:'Extensiver Kauf = höchstes Involvement, intensivste Informationssuche und Bewertung von Alternativen (z.B. Hauskauf, Autokauf). Im Gegensatz: Habituell = Gewohnheit, Impuls = spontan/emotional.'},
  {m:2,q:'Was unterscheidet Primär- von Sekundärforschung?',o:['Primär ist günstiger als Sekundär','Primär erhebt neue Daten; Sekundär nutzt vorhandene Daten','Sekundär ist aktueller als Primär','Es gibt keinen Unterschied'],a:1,e:'Primärforschung = neue Daten für spezifischen Zweck erheben (teuer, zeitaufwendig, aber aktuell und spezifisch). Sekundärforschung = vorhandene Daten nutzen (günstig, schnell, aber weniger spezifisch und eventuell veraltet).'},
  {m:2,q:'Was misst die Validität einer Messung?',o:['Ob die Messung wiederholbar ist','Ob die Messung misst, was sie messen soll','Ob die Messung unabhängig vom Forscher ist','Ob die Stichprobe groß genug ist'],a:1,e:'Validität = das Instrument misst tatsächlich das, was gemessen werden soll (Inhaltsvalidität, Konstruktvalidität). Reliabilität = Wiederholbarkeit/Stabilität. Objektivität = Unabhängigkeit vom Forscher.'},
  {m:3,q:'Was ist der Unterschied zwischen internen und externen SWOT-Faktoren?',o:['Es gibt keinen Unterschied','Stärken und Schwächen sind intern; Chancen und Risiken sind extern','Chancen und Risiken sind intern; Stärken und Schwächen extern','Alle SWOT-Faktoren sind extern'],a:1,e:'INTERN (vom Unternehmen beeinflussbar): Stärken (Strengths) und Schwächen (Weaknesses). EXTERN (nicht direkt beeinflussbar): Chancen (Opportunities) und Risiken (Threats). Klassische Prüfungsfrage!'},
  {m:3,q:'Was ist "Stuck in the Middle" laut Porter?',o:['Eine Nischenstrategie','Weder Kostenführerschaft noch Differenzierung — strategisch gefährlich','Eine Wachstumsstrategie','Ein Marketing-Mix-Problem'],a:1,e:'Porters Warnung: Unternehmen ohne klare Strategie (weder günstigster Anbieter noch differenziert) haben weder Kostenvorteile noch Alleinstellungsmerkmale. Sie konkurrieren auf allen Ebenen und gewinnen auf keiner.'},
  {m:3,q:'Welche Ansoff-Strategie hat das höchste Risiko?',o:['Marktdurchdringung','Marktentwicklung','Produktentwicklung','Diversifikation'],a:3,e:'Diversifikation (neues Produkt + neuer Markt) hat das höchste Risiko, da in beiden Dimensionen keine Erfahrung vorhanden ist. Marktdurchdringung (bestehend/bestehend) hat das niedrigste Risiko.'},
  {m:4,q:'Was sind die 3 Produktebenen?',o:['Basis-, Standard-, Premiumprodukt','Kernprodukt, reales Produkt, erweitertes Produkt','Rohstoff, Halbfertigprodukt, Fertigprodukt','Konzept, Design, Verpackung'],a:1,e:'Kernprodukt = Grundnutzen (warum kauft man es wirklich?). Reales Produkt = physische Ausgestaltung (Qualität, Design, Marke, Verpackung). Erweitertes Produkt = Zusatzleistungen (Garantie, Lieferung, After-Sales-Service).'},
  {m:4,q:'Was ist der "Chasm" in der Diffusionstheorie?',o:['Die Gesamtheit aller Innovatoren','Die kritische Lücke zwischen Early Adopters und Early Majority','Der Übergang von Reife zu Degeneration','Der Break-Even-Punkt einer Innovation'],a:1,e:'Geoffrey Moore: Der "Chasm" (Abgrund) ist die kritische Lücke zwischen Early Adopters (Visionäre) und Early Majority (Pragmatiker). Viele Innovationen scheitern daran, diese Lücke zu überbrücken.'},
  {m:5,q:'Wie lautet die Break-Even-Formel?',o:['x* = p / kv','x* = Kf / (p - kv)','x* = Kf + kv / p','x* = (p - kv) / Kf'],a:1,e:'Break-Even-Menge: x* = Kf / (p - kv). Dabei: Kf = Fixkosten, p = Preis, kv = variable Stückkosten, (p-kv) = Deckungsbeitrag pro Stück. Bei x* = Break-Even-Punkt ist der Gewinn = 0.'},
  {m:5,q:'Was bedeutet |η| > 1 bei der Preiselastizität?',o:['Inelastische Nachfrage — Preiserhöhung steigert Umsatz','Elastische Nachfrage — Preiserhöhung senkt Umsatz','Einheitselastische Nachfrage','Keine Auswirkung auf den Umsatz'],a:1,e:'|η| > 1 = elastische Nachfrage: Bei Preiserhöhung geht die Menge prozentual stärker zurück → Umsatz sinkt. |η| < 1 = unelastische Nachfrage: Preiserhöhung → Umsatz steigt. η ist fast immer negativ (Gesetz der Nachfrage).'},
  {m:5,q:'Was ist der Unterschied zwischen Skimming und Penetrationsstrategie?',o:['Skimming = niedriger Einführungspreis; Penetration = hoher Einführungspreis','Skimming = hoher Einführungspreis (sinkt); Penetration = niedriger Einführungspreis','Beide Strategien sind identisch','Skimming ist nur für Dienstleistungen geeignet'],a:1,e:'Skimming (Abschöpfung) = hoher Einführungspreis, der schrittweise gesenkt wird. Geeignet für Innovationen mit zahlungsbereiten Early Adopters. Penetration = niedriger Einführungspreis für schnelle Marktdurchdringung und Marktanteile.'},
  {m:6,q:'Was ist der entscheidende Unterschied zwischen Absatzmittler und Absatzhelfer?',o:['Absatzmittler sind günstiger','Absatzmittler = Eigentumsübergang; Absatzhelfer = KEIN Eigentumsübergang','Absatzhelfer haben direkten Kundenkontakt','Es gibt keinen Unterschied'],a:1,e:'Absatzmittler (Groß-/Einzelhändler) kaufen die Ware und verkaufen sie weiter = EIGENTUMSÜBERGANG. Absatzhelfer (Spediteur, Makler, Handelsvertreter) unterstützen den Vertrieb, ohne Eigentümer zu werden = KEIN Eigentumsübergang.'},
  {m:6,q:'Was ist exklusive Distribution?',o:['Produkt ist überall erhältlich','Nur ausgewählte Händler dürfen verkaufen','Alleinverkaufsrecht für Händler + Verpflichtung, keine Konkurrenzprodukte zu führen','Distribution über Internet'],a:2,e:'Exklusive Distribution = ein Händler erhält Alleinverkaufsrecht für ein bestimmtes Gebiet UND ist verpflichtet, keine konkurrierenden Produkte zu führen. Typisch für Luxusgüter (Rolex, Ferrari, Porsche).'},
  {m:6,q:'Was unterscheidet Messen von Ausstellungen?',o:['Messen für allgemeines Publikum','Messen für FACHBESUCHER (B2B); Ausstellungen für ALLGEMEINES PUBLIKUM (B2C)','Beide identisch','Messen nur für Großunternehmen'],a:1,e:'Messen: Fachbesucher, B2B, Wettbewerbsvergleich. Ausstellungen: allgemeines Publikum, B2C, Absatzziele.'},
  {m:6,q:'Was sind die 4 Konfliktursachen im Absatzkanalsystem?',o:['Preis-, Produkt-, Distributions-, Kommunikationskonflikte','Zielbeziehungen, Rollenbeziehungen, Machtbeziehungen, Kommunikationsbeziehungen','Lieferanten-, Händler-, Kunden-, Wettbewerberkonflikte','Kosten-, Qualitäts-, Mengen-, Zeitkonflikte'],a:1,e:'4 Konfliktursachen (Z-R-M-K): Zielbeziehungen (unterschiedliche Ziele Hersteller/Handel), Rollenbeziehungen (wer übernimmt welche Marketingfunktionen), Machtbeziehungen (Konzentration im Handel), Kommunikationsbeziehungen (Informationsvorsprung einer Partei).'},
  {m:6,q:'Was ist der entscheidende Unterschied zwischen SCM und ECR?',o:['Beide sind identisch','SCM optimiert nur Einkauf; ECR optimiert Verkauf','SCM optimiert die GESAMTE Lieferkette; ECR konzentriert sich NUR auf Hersteller ↔ Absatzmittler','ECR ist älter als SCM und umfassender'],a:2,e:'SCM = Supply Chain Management: gesamte Lieferkette optimieren. ECR = Efficient Consumer Response: fokussiert NUR auf die Schnittstelle Hersteller ↔ Absatzmittler, mit Nachfrager- und Logistikperspektive. ECR aus USA, 1990er.'},
  {m:6,q:'Was sind die 3 Grundtypen des Franchising?',o:['Einzel-, Groß-, Dienstleistungsfranchising','Produkt-, Service-, Handelsfranchising','Herstellergeführtes EH-Franchising, Herstellergeführtes GH-Franchising, Dienstleistungs-Franchising auf EH-Stufe','National-, Regional-, Lokalfranchising'],a:2,e:'3 Grundtypen: (1) Herstellergeführtes Einzelhändler-Franchising (z.B. VW-Händler). (2) Herstellergeführtes Großhändler-Franchising (z.B. Coca-Cola Abfüller). (3) Dienstleistungs-Franchising auf Einzelhandelsstufe (z.B. McDonald&#39;s, Subway).'},
  {m:6,q:'Was ist eine Rückwärtsintegration im Absatzkanal?',o:['Hersteller baut eigene Filialen auf','Händler übernimmt Herstellerfunktionen (z.B. Akquisition des Lieferanten, Aufbau eigener Produktion)','Hersteller nutzt Franchising','Händler kooperiert mit anderen Händlern'],a:1,e:'Rückwärtsintegration: Händler übernimmt Funktionen des Herstellers. Formen: Akquisition des Lieferanten → Aufbau eigener Produktion → Langfristige vertragliche Bindung des Lieferanten. Bsp: Handels-Eigenmarken. Vorwärtsintegration = Hersteller übernimmt Distributionsaufgaben.'},
  {m:6,q:'Was kennzeichnet das Kontraktkonzept?',o:['Strategie zur Preisgestaltung im Handel','Vertragliche Ausgestaltung der Beziehung zu den Absatzmittlern (inkl. Vertriebsbindung)','System zur Qualitätskontrolle im Handel','Regelung der Lieferkonditionen'],a:1,e:'Kontraktkonzept: Im Mittelpunkt steht die vertragliche Ausgestaltung der Beziehung zu den Absatzmittlern. Vertriebsbindung = vertragliche Verpflichtung zur Einhaltung eines bestimmten Absatzkanals. 3 Klassen: räumlich, personell, zeitbezogen.'},
  {m:6,q:'Was charakterisiert den Vertragshändler?',o:['Verkauft im Namen des Herstellers ohne Eigentumsübergang (= Absatzhelfer)','Kauft und verkauft im EIGENEN Namen und auf EIGENE Rechnung = Absatzmittler (Eigentumsübergang!)','Hat keine Verpflichtung zur Absatzförderung','Ist identisch mit einem Handelsvertreter'],a:1,e:'Vertragshändler = kauft Vertragsware im EIGENEN Namen und auf EIGENE Rechnung → Eigentumsübergang → Absatzmittler. Verpflichtet zur Absatzförderung der Vertragswaren + Verwendung des Herstellerzeichens. ≠ Handelsvertreter (verkauft im Namen des Auftraggebers = Absatzhelfer).'},
  {m:6,q:'Was kennzeichnet den Discounter (Merkmale)?',o:['Große Sortimentsbreite + Innenstadtlage + Selbstbedienung','Kostengünstige Lage + aggressive Preispolitik + Verkaufsfläche = Lagerfläche','Persönliche Beratung + breites Sortiment einer Branche','Kein gleichbleibendes Sortiment + Schnäppchen/Restposten'],a:1,e:'Discounter: (1) Kostengünstige Lage. (2) Aggressive Preispolitik. (3) Verkaufsfläche = Lagerfläche (kein separates Lager!). Bsp: Lidl, Hofer, Aldi. NICHT zu verwechseln mit Off-Price-Retailer (Restposten) oder Fachmarkt.'},
  {m:6,q:'Welche Kennzahlen beschreiben den Supermarkt?',o:['Fläche 2.000-5.000 m², 20.000+ Artikel','Fläche 400-800 m², 5.000-7.000 Artikel, in Wohngebieten','Fläche >10.000 m², 30.000-40.000 Artikel, verkehrsgünstig','Fläche 100-200 m², 1.000-2.000 Artikel, Innenstadtlage'],a:1,e:'Supermarkt: Fläche 400–800 m². Lebensmittel + begrenztes Non-Food-Angebot. 5.000–7.000 Artikel. In Wohngebieten. Verbrauchermarkt dagegen: Großbetrieb, 28.000–32.000 Produkte, verkehrsgünstig.'},
  {m:7,q:'Was sind die 3 Kommunikationsziele?',o:['Preis-, Produkt-, Vertriebsziele','Kognitive (Wissen), Affektive (Einstellung), Konative (Verhalten) Ziele','Reichweite, Frequenz, Impact','Kurz-, Mittel-, Langfristziele'],a:1,e:'3 Kommunikationsziele: Kognitiv = Bekanntheit, Wissen (Was weiß der Kunde?). Affektiv = Einstellungen, Image (Wie fühlt der Kunde?). Konativ = Verhalten, Kauf (Was tut der Kunde?). Reihenfolge wichtig!'},
  {m:7,q:'Was ist PR im Vergleich zu Werbung?',o:['PR ist teurer als Werbung','PR ist bezahlt und kontrolliert wie Werbung','PR ist nicht bezahlt und daher glaubwürdiger; zielt auf Image/Vertrauen','PR ist nur für B2B geeignet'],a:2,e:'PR (Public Relations) = nicht bezahlt, daher glaubwürdiger. Zielgruppe: breite Öffentlichkeit, Medien, Politik. Ziel: Vertrauen, Image. Werbung = bezahlt, kontrollierte Botschaft, direktes Absatzziel.'},
  {m:7,q:'Was ist der Unterschied zwischen Messen und Ausstellungen?',o:['Messen sind günstiger','Messen richten sich an Fachbesucher (B2B); Ausstellungen an allgemeines Publikum (B2C)','Ausstellungen sind international, Messen national','Messen finden drinnen statt, Ausstellungen draußen'],a:1,e:'Messen = Fachbesucher (B2B), Hauptziel: Geschäftsanbahnung, Networking, Wettbewerbsbeobachtung. Ausstellungen = allgemeines Publikum (B2C), Hauptziel: Absatz, Markenimage, Breitenwirkung.'},
];

function showLTab(t){
  ['login','reg','reset'].forEach(x=>{
    document.getElementById('lpanel-'+x).style.display='none';
    document.getElementById('lt-'+x)&&document.getElementById('lt-'+x).classList.remove('on');
  });
  document.getElementById('lpanel-'+t).style.display='block';
  document.getElementById('lt-'+t)&&document.getElementById('lt-'+t).classList.add('on');
}
async function doLogin(){
  const e=document.getElementById('lin-email').value.trim();
  const p=document.getElementById('lin-pw').value;
  const errEl=document.getElementById('lerr-login');
  errEl.classList.remove('show');
  if(!e||!p){errEl.textContent='Bitte E-Mail und Passwort eingeben.';errEl.classList.add('show');return;}
  document.getElementById('lbtn-login').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
  document.getElementById('lbtn-login').disabled=false;
  if(error){errEl.textContent=error.message;errEl.classList.add('show');return;}
  await initUser(data.user);
}
async function doReg(){
  const n=document.getElementById('rin-name').value.trim();
  const e=document.getElementById('rin-email').value.trim();
  const p=document.getElementById('rin-pw').value;
  const errEl=document.getElementById('lerr-reg');
  const sucEl=document.getElementById('lsuc-reg');
  errEl.classList.remove('show');sucEl.classList.remove('show');
  if(!n||!e||!p){errEl.textContent='Alle Felder ausfüllen.';errEl.classList.add('show');return;}
  if(p.length<6){errEl.textContent='Passwort mind. 6 Zeichen.';errEl.classList.add('show');return;}
  document.getElementById('lbtn-reg').disabled=true;
  const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});
  document.getElementById('lbtn-reg').disabled=false;
  if(error){errEl.textContent=error.message;errEl.classList.add('show');return;}
  sucEl.textContent='Bestätigungs-E-Mail gesendet! Bitte prüfe dein Postfach.';sucEl.classList.add('show');
}
async function doReset(){
  const e=document.getElementById('rsin-email').value.trim();
  const errEl=document.getElementById('lerr-reset');
  const sucEl=document.getElementById('lsuc-reset');
  errEl.classList.remove('show');sucEl.classList.remove('show');
  if(!e){errEl.textContent='Bitte E-Mail eingeben.';errEl.classList.add('show');return;}
  document.getElementById('lbtn-reset').disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin});
  document.getElementById('lbtn-reset').disabled=false;
  if(error){errEl.textContent=error.message;errEl.classList.add('show');return;}
  sucEl.textContent='Reset-Link gesendet! Prüfe dein Postfach.';sucEl.classList.add('show');
}
async function doLogout(){
  await sb.auth.signOut();
  user=null;paid=false;
  document.getElementById('app').style.display='none';
  document.getElementById('ls').classList.remove('hide');
}
async function initUser(u){
  user=u;
  const email=u.email||'';
  paid=FREE_EMAILS.includes(email)||false;
  if(!paid){
    const {data}=await sb.from('subscribers').select('active').eq('user_id',u.id).single();
    paid=!!(data&&data.active);
  }
  document.getElementById('ls').classList.add('hide');
  document.getElementById('app').style.display='flex';
  const name=u.user_metadata?.full_name||email.split('@')[0]||'User';
  const initials=name.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'U';
  document.getElementById('ubadge').innerHTML=`<div class="uav">${initials}</div><span class="uname">${name}</span>`;
  nav('home');
}
function nav(v,mod){
  if(examMode&&v!=='exam'){if(!confirm('Klausur abbrechen?'))return;stopExam();}
  curView=v;curMod=mod??null;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  const ni=document.getElementById(v==='mod'?'ni-'+mod:'ni-'+v);
  if(ni)ni.classList.add('on');
  if(v==='home')rHome();
  else if(v==='mod')rMod(mod);
  else if(v==='cards')rCards();
  else if(v==='quiz')rQuiz();
  else if(v==='exam')rExam();
  else if(v==='imp')rImp();
}
function setPage(title,sub,pills='',content=''){
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-sub').textContent=sub;
  document.getElementById('top-pills').innerHTML=pills;
  document.getElementById('cnt').innerHTML=content;
}
function rHome(){
